<title>Lucky Draw</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;900&display=block">
<style>
/* Layout: the 16:9 canvas fills the space above a slim control bar, letterboxed on the page background. */
:root {
  --bg: #0b0a2a;
  --bar: #171447;
  --line: #2c2679;
  --fg: #eceaff;
  --dim: #a9a4dd;
  --accent: #ffd23f;
  --f-ui: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-ui); display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; box-sizing: border-box; gap: 12px; }
.stage { flex: 1; min-height: 0; }
canvas { width: 100%; height: 100%; object-fit: contain; display: block; background: var(--bg); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: var(--bar); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
button { font: 800 15px var(--f-ui); color: var(--bg); background: var(--accent); border: 0; border-radius: 999px; padding: 8px 18px; min-width: 84px; cursor: pointer; }
button#snd, button#fs { background: transparent; color: var(--fg); border: 1.5px solid var(--dim); }
button:focus-visible, input:focus-visible { outline: 3px solid #56e8ff; outline-offset: 2px; }
input[type=range] { flex: 1 1 200px; min-width: 120px; accent-color: var(--accent); }
.time { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--dim); font-size: 14px; min-width: 9ch; }
label.loop { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; color: var(--dim); }
</style>
<div class="stage"><canvas id="cv" width="1280" height="720" aria-label="Animated lucky draw results"></canvas></div>
<div class="bar">
  <button id="play" type="button" aria-pressed="false">Play</button>
  <input id="scrub" type="range" min="0" max="37" step="0.01" value="0" aria-label="Seek">
  <span id="time" class="time">0:00.0</span>
  <button id="snd" type="button" aria-pressed="true">Sound on</button>
  <label class="loop"><input id="loop" type="checkbox" checked> Loop</label>
  <button id="fs" type="button">Full screen</button>
</div>
<script>
// Shared helpers + style registry for the style-frame explorations.
// Every style is a pure function of time: draw(ctx, W, H, t). Same t => same pixels.
(function () {
  const STYLES = (window.STYLES = window.STYLES || []);
  window.registerStyle = (s) => STYLES.push(s);

  const H = (window.H = {});

  // ---------- seeded randomness ----------
  // H.rng(seed) -> r() in [0,1). Extras: r.range(a,b), r.int(a,b), r.pick(arr), r.gauss(), r.chance(p)
  H.rng = function (seed = 1) {
    let a = typeof seed === 'string' ? hashStr(seed) : (seed >>> 0) || 1;
    const r = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + r() * (hi - lo);
    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  };
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  // ---------- gradient noise ----------
  // H.makeNoise(seed) -> { n2(x,y), n3(x,y,z), fbm2(x,y,oct), fbm3(x,y,z,oct) }  (outputs roughly -1..1)
  H.makeNoise = function (seed = 1) {
    const r = H.rng(seed), p = new Uint8Array(512), perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    const g3 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      return lerp(lerp(lerp(g3(p[AA], x, y, z), g3(p[BA], x - 1, y, z), u), lerp(g3(p[AB], x, y - 1, z), g3(p[BB], x - 1, y - 1, z), u), v),
        lerp(lerp(g3(p[AA + 1], x, y, z - 1), g3(p[BA + 1], x - 1, y, z - 1), u), lerp(g3(p[AB + 1], x, y - 1, z - 1), g3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
    const n2 = (x, y) => n3(x, y, 0.5);
    const fbm3 = (x, y, z, oct = 4) => { let s = 0, a = 0.5, f = 1, norm = 0; for (let i = 0; i < oct; i++) { s += a * n3(x * f, y * f, z * f); norm += a; a *= 0.5; f *= 2; } return s / norm; };
    const fbm2 = (x, y, oct = 4) => fbm3(x, y, 0.5, oct);
    return { n2, n3, fbm2, fbm3 };
  };

  // ---------- math ----------
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  H.map = (v, a, b, c, d) => c + ((v - a) / (b - a)) * (d - c);
  H.smooth = (e0, e1, x) => { const t = H.clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  H.ease = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    out: (t) => 1 - Math.pow(1 - t, 3),
    in: (t) => t * t * t,
    back: (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };

  // ---------- color ----------
  H.hex = (h) => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  H.rgba = (hexOrArr, a = 1) => { const [r, g, b] = Array.isArray(hexOrArr) ? hexOrArr : H.hex(hexOrArr); return `rgba(${r | 0},${g | 0},${b | 0},${a})`; };
  H.mix = (c1, c2, t) => { const a = Array.isArray(c1) ? c1 : H.hex(c1), b = Array.isArray(c2) ? c2 : H.hex(c2); return [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * t); };

  // ---------- canvas utilities ----------
  // Offscreen canvas of the same logical size (use for layers, masks, compositing).
  H.layer = (W, H_, ) => { const c = document.createElement('canvas'); c.width = W; c.height = H_; return c; };
  // Monochrome grain / film noise over the whole canvas. amount ~ 0.03-0.15
  H.grain = function (ctx, W, Hh, amount = 0.08, seed = 7, mono = true) {
    const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height), d = img.data, r = H.rng(seed), k = amount * 255;
    for (let i = 0; i < d.length; i += 4) {
      const n = (r() - 0.5) * k;
      if (mono) { d[i] += n; d[i + 1] += n; d[i + 2] += n; }
      else { d[i] += (r() - 0.5) * k; d[i + 1] += (r() - 0.5) * k; d[i + 2] += (r() - 0.5) * k; }
    }
    ctx.putImageData(img, 0, 0);
  };
  // Paper-ish texture tile: fills with base color + fibrous noise (cheap; drawn into ctx).
  H.paper = function (ctx, W, Hh, base = '#f3ecdc', seed = 3, strength = 0.06) {
    ctx.save(); ctx.fillStyle = base; ctx.fillRect(0, 0, W, Hh);
    const nz = H.makeNoise(seed), cell = 4, [br, bg, bb] = H.hex(base);
    for (let y = 0; y < Hh; y += cell) for (let x = 0; x < W; x += cell) {
      const v = nz.fbm2(x * 0.01, y * 0.01, 3) * 0.6 + nz.n2(x * 0.15, y * 0.04) * 0.4;
      const s = 1 + v * strength * 2;
      ctx.fillStyle = `rgb(${br * s | 0},${bg * s | 0},${bb * s | 0})`; ctx.fillRect(x, y, cell, cell);
    }
    ctx.restore();
  };
  // Vignette
  H.vignette = function (ctx, W, Hh, strength = 0.5, color = '0,0,0') {
    const g = ctx.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * 0.3, W / 2, Hh / 2, Math.hypot(W, Hh) * 0.6);
    g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${strength})`);
    ctx.save(); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh); ctx.restore();
  };

  // ---------- rendering entry ----------
  // Renders style into canvas at logical 1280x720 (canvas can be any pixel size; it is scaled).
  H.W = 1280; H.H = 720;
  H.loadFonts = async function (style) {
    const specs = style.fonts || [];
    try { const sample = 'AaZz09' + (window.FONT_SAMPLE || '');
      await Promise.all(specs.map((f) => document.fonts.load(f, sample))); await document.fonts.ready; } catch (e) { /* render anyway */ }
  };
  H.render = function (style, canvas, t) {
    const ctx = canvas.getContext('2d', { willReadFrequently: !!style.readsPixels });
    const sx = canvas.width / H.W, sy = canvas.height / H.H;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.scale(sx, sy);
    style.draw(ctx, H.W, H.H, t == null ? style.frameT || 0 : t);
    ctx.restore();
  };
})();
</script>
<script>
// sound.js: a small synthesized sound kit for the style explainers. Plain Web Audio, no audio files.
// Voiceover mode: SOUND.kit(ctx, { voiceover: true }) drops beds and music, plays anything marked minor
// (play(..., { minor: true }), tone/noise { minor: true }, or scheduled inside k.withMinor(() => ...)) at about 60%
// volume instead of full, and sits all effects a little lower, so the narration stays on top while the piece still
// sounds alive. In the full mix, minor sounds play at full volume. Scores can read k.vo to branch further.
// A style adds   explainerSound(k) { k.bed('room', 0, D); k.play('pop', 1.25); ... }   and the same
// call schedules into a live AudioContext (the player) or an OfflineAudioContext (the video render).
// Times are seconds on the explainer's own clock. Randomness is seeded, so every render is identical.
(function () {
  'use strict';
  const SOUND = (window.SOUND = {});
  const TINY = 1e-4;

  // seeded random in [0,1), keyed by any string
  function rand(key) {
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0 || 1;
    return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // note names to Hz: 'A4' = 440, 'C#5', 'Eb3'
  const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const semis = STEP[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) - 4) * 12 - 9;
    return 440 * Math.pow(2, semis / 12);
  }
  SOUND.hz = hz;

  SOUND.kit = function (ctx, opts) {
    const o = opts || {};
    const VO = !!o.voiceover;
    const MINOR = 0.6; // voiceover-mode volume for minor sounds
    let inMinor = false;
    const gainOf = (p, d) => (p.gain == null ? d : p.gain) * (VO && (p.minor || inMinor) ? MINOR : 1);
    const T0 = (o.start || 0) - 0; // explainer time that maps to ctx time `base`
    const base = ctx.currentTime + (o.delay || 0);
    // Start times snap to the sample grid (+ a quarter sample): in Chrome a source started a hair off the grid can
    // spike to about twice its set level.
    const SR = ctx.sampleRate;
    const at = (t) => (Math.round((base + (t - T0)) * SR) + 0.25) / SR;

    // ---- buses: sfx, amb, music -> compressor -> master; one shared reverb send
    const master = ctx.createGain(); master.gain.value = o.master == null ? 0.9 : o.master;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.18;
    comp.connect(master); master.connect(o.dest || ctx.destination);
    const bus = {};
    for (const [name, g] of Object.entries({ sfx: VO ? 0.7 : 0.85, amb: 0.5, music: 0.45 })) { bus[name] = ctx.createGain(); bus[name].gain.value = g; bus[name].connect(comp); }

    // generated room reverb: decaying stereo noise, darker toward the tail
    const verb = ctx.createConvolver();
    {
      const secs = 1.6, n = Math.floor(secs * ctx.sampleRate), ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const r = rand('verb' + c), d = ir.getChannelData(c); let lp = 0;
        for (let i = 0; i < n; i++) { const u = i / n; lp += (0.6 - 0.45 * u) * ((r() * 2 - 1) - lp); d[i] = lp * Math.pow(1 - u, 3); }
      }
      verb.buffer = ir;
    }
    const verbIn = ctx.createGain(); verbIn.gain.value = 0.9; verbIn.connect(verb); verb.connect(comp);

    // seeded noise buffers: white, pink-ish and brown
    const noiseBuf = {};
    {
      const n = Math.floor(2.5 * ctx.sampleRate);
      for (const kind of ['white', 'pink', 'brown']) {
        const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), r = rand('noise-' + kind);
        let p0 = 0, p1 = 0, p2 = 0, br = 0;
        for (let i = 0; i < n; i++) {
          const w = r() * 2 - 1;
          if (kind === 'white') d[i] = w;
          else if (kind === 'pink') { p0 = 0.997 * p0 + 0.029 * w; p1 = 0.985 * p1 + 0.032 * w; p2 = 0.95 * p2 + 0.048 * w; d[i] = (p0 + p1 + p2 + w * 0.05) * 2.2; }
          else { br = (br + 0.02 * w) / 1.02; d[i] = br * 3.2; }
        }
        noiseBuf[kind] = b;
      }
    }

    // ---- automation helpers
    // a value or [[dt, value], ...] from the voice start; ramps are exponential (frequencies)
    function sweep(param, v, t) {
      if (!Array.isArray(v)) { param.setValueAtTime(v, t); return; }
      param.setValueAtTime(v[0][1], t + v[0][0]);
      for (let i = 1; i < v.length; i++) param.exponentialRampToValueAtTime(Math.max(v[i][1], 1), t + v[i][0]);
    }
    // A long sound (a bed or music) already under way where playback starts from - e.g. after seeking - joins in
    // progress instead of being scheduled in the past, which the Web Audio API rejects (and that error used to stop
    // the whole score from being scheduled).
    function joinLate(t, dur, p) {
      const now = ctx.currentTime + 0.005;
      if (t >= now) return [t, dur, p];
      const skipped = now - t;
      return [now, dur - skipped, Object.assign({}, p, { a: Math.min(p.a == null ? 0.004 : p.a, 0.05), hold: Math.max(0, (p.hold || 0) - skipped) })];
    }
    // amplitude: linear attack to `gain`, optional hold, exponential release to silence by `dur`
    function shape(param, t, gain, dur, a, hold) {
      a = Math.min(a == null ? 0.004 : a, dur * 0.9);
      hold = Math.min(hold || 0, dur - a);
      param.setValueAtTime(0, t);
      param.linearRampToValueAtTime(gain, t + a);
      if (hold > 0) param.setValueAtTime(gain, t + a + hold);
      param.exponentialRampToValueAtTime(TINY, t + dur);
      param.setValueAtTime(0, t + dur + 0.001);
    }
    function out(node, p) {
      const pan = ctx.createStereoPanner(); pan.pan.value = Math.max(-1, Math.min(1, p.pan || 0));
      node.connect(pan); pan.connect(bus[p.bus || 'sfx']);
      if (p.verb) { const s = ctx.createGain(); s.gain.value = p.verb; pan.connect(s); s.connect(verbIn); }
    }
    function filterNode(p, t) {
      if (!p.filter) return null;
      const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 1 : p.q;
      sweep(f.frequency, p.f == null ? 1000 : p.f, t);
      return f;
    }

    // ---- primitives
    // tone(t, { f, type, dur, gain, a, hold, pan, verb, bus, filter, f2 (filter freq), q, detune })
    function tone(time, p) {
      let t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      [t, dur, p] = joinLate(t, dur, p);
      const osc = ctx.createOscillator(); osc.type = p.type || 'sine';
      sweep(osc.frequency, Array.isArray(p.f) ? p.f.map(([d, v]) => [d, hz(v)]) : hz(p.f || 440), t);
      if (p.detune) osc.detune.value = p.detune;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      let node = osc;
      if (p.filter) { const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 0.8 : p.q; sweep(f.frequency, p.f2 || 2000, t); osc.connect(f); node = f; }
      node.connect(g); out(g, p);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
    // noise(t, { dur, color, filter, f, q, gain, a, hold, pan, verb, bus, rate })
    function noise(time, p) {
      let t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      [t, dur, p] = joinLate(t, dur, p);
      const src = ctx.createBufferSource(); src.buffer = noiseBuf[p.color || 'white']; src.loop = true;
      if (p.rate) src.playbackRate.value = p.rate;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      const f = filterNode(p, t);
      if (f) { src.connect(f); f.connect(g); } else src.connect(g);
      out(g, p);
      const off = rand('off' + time + (p.f || ''))() * 2;
      src.start(t, off); src.stop(t + dur + 0.02);
    }

    // ---- named sounds. play(name, t, opts): opts.gain scales the whole sound, opts.pan places it.
    const S = {
      // UI / motion graphics
      pop: (t, o) => { tone(t, { f: [[0, o.f || 620], [0.07, (o.f || 620) * 0.45]], dur: 0.1, gain: 0.32 * o.g, pan: o.pan }); noise(t, { dur: 0.012, filter: 'highpass', f: 3000, gain: 0.12 * o.g, pan: o.pan }); },
      tick: (t, o) => noise(t, { dur: 0.018, filter: 'bandpass', f: o.f || 4200, q: 2.5, gain: 0.3 * o.g, pan: o.pan }),
      click: (t, o) => { tone(t, { f: o.f || 1900, type: 'square', dur: 0.02, gain: 0.08 * o.g, filter: 'lowpass', f2: 3000, pan: o.pan }); noise(t, { dur: 0.01, filter: 'highpass', f: 2500, gain: 0.15 * o.g, pan: o.pan }); },
      tock: (t, o) => { tone(t, { f: o.f || 820, dur: 0.07, gain: 0.25 * o.g, pan: o.pan }); noise(t, { dur: 0.05, filter: 'bandpass', f: o.f || 820, q: 9, gain: 0.35 * o.g, pan: o.pan }); },
      blip: (t, o) => tone(t, { f: o.f || 'E6', type: o.type || 'square', dur: o.dur || 0.07, gain: 0.07 * o.g, a: 0.002, hold: (o.dur || 0.07) * 0.6, pan: o.pan }),
      whoosh: (t, o) => { const d = o.dur || 0.45; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 350], [d * 0.55, o.top || 2600], [d, 700]], q: 0.9, gain: 0.32 * o.g, a: d * 0.5, pan: o.pan, verb: 0.15 }); },
      swish: (t, o) => { const d = o.dur || 0.18; noise(t, { dur: d, filter: 'highpass', f: [[0, 1800], [d, 5200]], q: 0.7, gain: 0.22 * o.g, a: d * 0.35, pan: o.pan }); },
      riser: (t, o) => { const d = o.dur || 0.8; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 300], [d, 4000]], q: 1.2, gain: 0.25 * o.g, a: d * 0.95, pan: o.pan, verb: 0.2 }); tone(t, { f: [[0, 180], [d, 720]], type: 'triangle', dur: d, gain: 0.06 * o.g, a: d * 0.9 }); },
      thud: (t, o) => { tone(t, { f: [[0, o.f || 130], [0.16, 42]], dur: 0.26, gain: 0.55 * o.g, pan: o.pan }); noise(t, { dur: 0.09, color: 'brown', filter: 'lowpass', f: 500, gain: 0.35 * o.g, pan: o.pan }); },
      impact: (t, o) => { S.thud(t, o); noise(t, { dur: 0.7, color: 'pink', filter: 'lowpass', f: [[0, 2400], [0.6, 300]], gain: 0.3 * o.g, verb: 0.35, pan: o.pan }); },

function drumBeat(x, t) {
  const din = back(seg(t, TL.drumIn[0], TL.drumIn[1]), 1.2), out = ei(seg(t, TL.out5, TL.out5 + 0.45));
  if (din <= 0 || out >= 1) return;
  drawHead(x, '17 \u00d7 $20', t, TL.head4, TL.out5);
  const spin = drumSpin(t), { cx, cy, r } = DRUM;
  const drawn = [...Array(17).keys()].filter((i) => t >= DRAW_T(i)).length;
  // the drum, its stand and chute
  x.save(); x.translate(-420 * out, 0); x.translate(cx, cy + 260); x.scale(din, din); x.translate(-cx, -cy - 260);
  x.fillStyle = '#2b1f85'; rr(x, cx - 18, cy, 36, 230, 10); x.fill();
  x.fillStyle = '#3d2e98'; rr(x, cx - 120, cy + 220, 240, 30, 15); x.fill();
  x.save(); x.translate(CHUTE[0], CHUTE[1]); x.rotate(-0.78);
  const cg = x.createLinearGradient(0, -22, 0, 22); cg.addColorStop(0, '#ffd23f'); cg.addColorStop(1, '#f08c2a');
  x.fillStyle = cg; rr(x, -10, -22, 80, 44, 14); x.fill(); x.restore();
  glow(x, cx, cy, r * 1.5, '#ffd23f', 0.18);
  x.fillStyle = 'rgba(255,255,255,0.10)'; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill();
  // balls tumbling inside: fewer as they're drawn
  x.save(); x.beginPath(); x.arc(cx, cy, r - 10, 0, TAU); x.clip();
  const rng = H.rng(77);
  for (let k = 0; k < 34 - drawn; k++) {
    const rad = rng.range(0.15, 0.82) * r, a0 = rng.range(0, TAU), wob = rng.range(0, TAU);
    const a = a0 + spin * rng.range(0.6, 1.0), fall = 0.35 * Math.sin(spin * 1.3 + wob);
    ball(x, cx + Math.cos(a) * rad, cy + Math.sin(a) * rad * 0.9 + fall * 30, 15, DRUM_PALS()[k % 4], { sh: 0.34, sha: 0.5, rima: 0.4 });
  }
  x.restore();
  // rim and spokes
  x.save(); x.translate(cx, cy); x.rotate(spin);
  x.strokeStyle = 'rgba(255,233,214,0.55)'; x.lineWidth = 5;
  for (let k = 0; k < 8; k++) { const a = (k * TAU) / 8; x.beginPath(); x.moveTo(0, 0); x.lineTo(Math.cos(a) * r, Math.sin(a) * r); x.stroke(); }
  x.restore();
  const rg = x.createLinearGradient(cx - r, cy - r, cx + r, cy + r); rg.addColorStop(0, '#ffe08a'); rg.addColorStop(1, '#f08c2a');
  x.strokeStyle = rg; x.lineWidth = 16; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.stroke();
  ball(x, cx, cy, 22, C.orange, { sh: 0.3, sha: 0.5 });
  x.restore();
  // balls flying out to the list, then the names
  for (let i = 0; i < 17; i++) {
    const t0 = DRAW_T(i), u = seg(t, t0, t0 + TL.fly);
    if (u <= 0) continue;
    const [sx, sy] = SLOT_XY(i), bx = sx - 170 + 24, row = i % 9, to = TL.out5 + row * 0.05, dy = -(sy + 120) * ei(seg(t, to, to + 0.45));
    if (u < 1) {
      const P = [CHUTE, [CHUTE[0] + 90, CHUTE[1] - 280], [bx - 80, sy - 140], [bx, sy]], e = eio(u), [px, py] = bez(P, e);
      arrow(x, P, e, C.yellow, 4, { dots: true, head: false, a: 0.45 });
      ball(x, px, py, lerp(12, 15, e), DRUM_PALS()[i % 4], { sh: 0.34, sha: 0.5, rima: 0.4 });
      continue;
    }
    const land = t - t0 - TL.fly, pu = back(seg(land, 0, 0.3), 1.4);
    if (dy < -(sy + 100)) continue;
    x.save(); x.translate(0, dy); x.translate(sx, sy); x.scale(pu, pu); x.translate(-sx, -sy);
    smallCard(x, sx, sy, NAMES[19 - i], i); x.restore();
    if (land < 0.6) spark(x, bx + 14, sy - 14 + dy, 12 * (1 - land / 0.6), '#ffffff', 1);
  }
}

// ================= act 1: sunrise hook, 50 entries, the draw =================

  x.save();
  if (zoom > 1.001) { x.translate(640, 470); x.scale(zoom, zoom); x.translate(-640, -470); }
  sky(x, W, H_, t, { x: t * 45, sun: { x: sxp, y: sy, r: 185 } });
  x.restore();

  // ---- hook: runner jogging, title, pills
  if (t < 3.2) {
    const tp = eio(seg(t, TL.shrink[0], TL.shrink[1]));

// ================= act 3: gold medal, then the pack =================

  const hitAge = t - TL.hit, amp = hitAge > 0 && hitAge < 0.6 ? 10 * Math.exp(-hitAge * 8) : 0;

    for (let i = 0; i < 14; i++) { const a = i * TAU / 14 + 0.2; x.fillStyle = `rgba(255,226,140,${0.1 * ra})`; x.beginPath(); x.moveTo(0, 0); x.lineTo(Math.cos(a - 0.08) * 900, Math.sin(a - 0.08) * 900); x.lineTo(Math.cos(a + 0.08) * 900, Math.sin(a + 0.08) * 900); x.fill(); }
    x.restore();
    const ms = back(seg(t, TL.medalPop[0], TL.medalPop[1]), 1.3) * ra, e0 = t - TL.medalPop[0];

      x.save(); x.translate(640, 330 - 320 * out); x.scale(ms, ms); x.translate(0, -412); x.rotate(ang); x.translate(0, 412);
      medal(x, 0, 0, 165, PL.gold, { rl: 330, label: '1', ls: 230, glowA: 0.5 }); x.restore();
    }
    x.save(); x.globalAlpha *= ra; twinkles(x, 12, 12, 640, 330, 560, 260, t); x.restore();
    pill(x, 640, 94, '1st PRIZE', 54, { s: back(seg(t, TL.pill1, TL.pill1 + 0.4)), a: fade, bg: '#ffd23f' });
    if (t > TL.cnt210[0]) scaled(x, 640, 565, bump(t, TL.hit, 0.3, 0.18), () => text(x, '$' + val210(t), 640, 565, 140, C.green, { a: fade * cl(seg(t, TL.cnt210[0], TL.cnt210[0] + 0.1)) }));
    pill(x, 640, 668, NAMES[0], 52, { s: back(seg(t, TL.name1, TL.name1 + 0.35)), a: fade, bg: '#ffffff' });
    burst(x, 640, 330, hitAge, 7, 420);

  const cu = back(seg(t, TL.cong, TL.cong + 0.45), 1.3);

  const pals = [C.teal, C.orange, PL.magenta.c, C.tan];
  for (let i = 0; i < 20; i++) {

  }
  if (t > TL.pack0 + 0.5) { x.save(); x.globalAlpha *= seg(t, TL.pack0 + 0.5, TL.pack0 + 1.0); twinkles(x, 21, 8, 640, 300, 560, 120, t); x.restore(); }
  const lu = back(seg(t, TL.line8, TL.line8 + 0.4), 1.3);
  if (lu > 0) scaled(x, 640, 610, lu, () => text(x, 'to all 20 winners', 640, 610, 60, '#ffffff'));
  burst(x, 640, 330, t - TL.line8, 9, 480);
  quip(x, ['Everyone else: you still won fitness (not redeemable for cash). See you next year!'], t, 35.6, 99, 640, 686, 24);

}

// ================= the explainer =================
function explainer(x, W, H_, t) {
  t = cl(t, 0, DURATION);
  const sw = eio(seg(t, TL.sweep[0], TL.sweep[1])), spx = lerp(W + 980, -980, sw);
  if (t < TL.sweep[0] || spx > 640) act1(x, W, H_, t);
  else if (t < TL.sw3) act2(x, W, H_, t);
  else act3(x, W, H_, t);
  // the foreground sun sweeps across as the wipe
  if (sw > 0 && sw < 1) {
    const cy = 380 + (sw - 0.5) * 120;
    glow(x, spx, cy, 1500, '#ff9a4a', 0.4);
    ball(x, spx, cy, 880, PL.sun.c, { sh: 0.3, sha: 0.4, rima: 0.4 });
  }
  // dive into the medal: glow whiteout
  const wo = seg(t, TL.white[0], TL.white[1]) * (1 - seg(t, TL.white[1] + 0.05, TL.white[1] + 0.45));
  if (wo > 0) {
    const g = x.createRadialGradient(640, 360, 0, 640, 360, 800);
    g.addColorStop(0, H.rgba('#fff6d0', wo)); g.addColorStop(0.5, H.rgba('#ffe28a', wo * 0.95)); g.addColorStop(1, H.rgba('#ffa24a', wo * 0.9));
    x.fillStyle = g; x.fillRect(0, 0, W, H_);
  }
  // Drawn over the wipe so it can stay up until the "Winners 20 - 11" cards reach the bottom row (~10.2s).
  quip(x, ["Picked by a beacon run by the League of Entropy. Yes, that's a real thing."], t, 4.9, 10.0, 640, 688, 26, true);
  const ha = seg(t, 2.1, 2.4) * (1 - seg(t, TL.out8[0] + 0.1, TL.out8[0] + 0.4));
  if (ha > 0) { x.save(); x.globalAlpha = ha; corner(x); x.restore(); }
  finish(x, W, H_, t);
}

// ================= sound =================
function scoreSound(k) {
  const D = DURATION, hz = k.hz;
  const pan = (px) => cl((px / 1280) * 2 - 1, -1, 1) * 0.6;
  const when = (t0, t1, ease, u) => { for (let i = 0; i <= 400; i++) { const tt = t0 + ((t1 - t0) * i) / 400; if (ease(i / 400) >= u - 1e-6) return tt; } return t1; };
  const backPeak = (t0, t1) => when(t0, t1, (u) => back(u), 1);
  const pluck = (t, n, g = 1, p = 0, minor = false) => {
    const f = hz(n);
    k.tone(t, { f, dur: 0.9, gain: 0.2 * g, a: 0.003, pan: p, verb: 0.25, minor });
    k.tone(t, { f: f * 4, dur: 0.09, gain: 0.04 * g, a: 0.001, pan: p, minor });
    k.tone(t, { f: f * 2, type: 'triangle', dur: 0.32, gain: 0.045 * g, a: 0.003, pan: p, minor });
  };
  const boop = (t, f0, g = 1, p = 0, minor = true) => {
    k.tone(t, { f: [[0, f0], [0.07, f0 * 1.45], [0.16, f0 * 1.3]], dur: 0.2, gain: 0.17 * g, a: 0.008, pan: p, verb: 0.15, minor });
    k.tone(t, { f: [[0, f0 * 0.5], [0.08, f0 * 0.72]], type: 'triangle', dur: 0.14, gain: 0.06 * g, a: 0.006, pan: p, minor });
  };
  const air = (t, dur, top, g = 1, p = 0, peak = 0.55, minor = false) =>
    k.noise(t, { dur, color: 'pink', filter: 'bandpass', f: [[0, 260], [dur * peak, top], [dur, 340]], q: 0.55, gain: 0.26 * g, a: dur * peak, pan: p, verb: 0.3, minor });
  const chord = (t, notes, g = 1, dur = 2.2) => notes.forEach((n, i) => {
    k.tone(t + i * 0.012, { f: n, type: 'triangle', dur, gain: 0.07 * g, a: 0.02, verb: 0.35, filter: 'lowpass', f2: 1800, pan: (i / (notes.length - 1) - 0.5) * 0.6 });
    k.tone(t + i * 0.012, { f: hz(n) * 1.003, dur, gain: 0.06 * g, a: 0.03, verb: 0.35 });
  });
  const shimmer = (t, notes, g = 1, p = 0) => k.withMinor(() => notes.forEach((n, i) => k.tone(t + i * 0.055, { f: n, dur: 0.7, gain: 0.07 * g, a: 0.004, verb: 0.4, pan: p + (i % 2 ? 0.25 : -0.25) })));
  const clink = (t, n, g = 1, p = 0) => { const f = hz(n); k.tone(t, { f, dur: 0.6, gain: 0.13 * g, a: 0.001, verb: 0.3, pan: p }); k.tone(t, { f: f * 2.76, dur: 0.18, gain: 0.04 * g, a: 0.001, pan: p }); };
  // times at which a displayed integer changes, thinned to at most ~11 a second
  const countTimes = (fn, t0, t1) => { const out = []; let last = fn(t0 - 0.01), lastT = -9; for (let tt = t0; tt <= t1; tt += 1 / 120) { const v = fn(tt); if (v !== last) { last = v; if (tt - lastT >= 1 / 11) { out.push(tt); lastT = tt; } } } return out; };
  const steps = (t0, t1, dt, fn) => { for (let tt = t0, i = 0; tt < t1; tt += dt, i++) fn(tt, i); };

  k.bed('room', 0, D, { gain: 0.6 });
  k.music('pad', 0, D, { bpm: 64, gain: 0.4, chords: [['C3', 'G3', 'E4', 'B4'], ['A2', 'E3', 'C4', 'G4'], ['F2', 'C3', 'A3', 'E4'], ['G2', 'D3', 'B3', 'F4']] });

  // ---- 1 hook: sunrise, starter pistol, title, jogging
  air(0, 1.4, 1500, 0.8, 0, 0.35);
  k.noise(TL.title, { dur: 0.1, filter: 'highpass', f: 1500, gain: 0.45, a: 0.001, verb: 0.2 });
  k.play('thud', TL.title, { f: 110, gain: 0.4 });
  ['C4', 'G4'].forEach((n, i) => pluck(TL.title + i * 0.13 + 0.06, n, 0.9, (i - 0.5) * 0.3));
  boop(backPeak(TL.runnerIn[0], TL.runnerIn[1]), 330, 1.0, 0, false);
  boop(TL.brand + 0.12, 470, 0.8, 0.1);
  boop(TL.results + 0.12, 520, 0.8, -0.1);
  steps(1.0, 3.0, 0.349, (tt, i) => k.play('tock', tt, { f: 240, gain: 0.2, pan: i % 2 ? 0.25 : -0.25, minor: true }));
  k.noise(TL.shrink[0], { dur: 0.6, color: 'pink', filter: 'bandpass', f: [[0, 700], [0.6, 300]], q: 0.7, gain: 0.08, a: 0.2, pan: -0.3, minor: true });
  air(TL.runnerOut[0], 0.9, 1100, 0.45, 0.2, 0.5, true);

  // ---- 2 50 entries and 20 winners
  air(TL.trackIn[0], 0.9, 1300, 0.6, -0.3, 0.5, true);
  countTimes((tt) => { let n = 0; for (let i = 0; i < 50; i++) if (tt >= DOT_T(i)) n++; return n; }, TL.cnt50[0], TL.cnt50[1]).forEach((tt, i) => k.play('tick', tt, { f: 3400 + i * 40, gain: 0.8, pan: -0.4 }));
  pluck(TL.cnt50[1], 'C4', 1.0, -0.4); pluck(TL.cnt50[1] + 0.07, 'G4', 0.8, -0.3); clink(TL.cnt50[1] + 0.05, 'E6', 0.8, -0.3);
  boop(3.9 + 0.12, 440, 0.7, -0.4);
  air(TL.medalIn[0], 0.6, 1500, 0.5, 0.5, 0.5, true);
  clink(TL.medalIn[1], 'A5', 1.0, 0.5); clink(TL.medalIn[1] + 0.12, 'E6', 0.6, 0.45); clink(TL.medalIn[1] + 0.26, 'A5', 0.4, 0.5);
  k.play('stroke', TL.arrow[0], { dur: 0.4, material: 'marker', gain: 0.7 });
  boop(4.0 + 0.12, 560, 0.7, 0.5);
  countTimes(count20, TL.cnt20[0], TL.cnt20[1]).forEach((tt, i) => k.play('tick', tt, { f: 3800 + i * 60, gain: 0.8, pan: 0.5 }));
  pluck(TL.cnt20[1], 'E4', 1.1, 0.4); pluck(TL.cnt20[1] + 0.07, 'B4', 0.9, 0.4); k.play('ding', TL.cnt20[1] + 0.02, { f: 'A6', gain: 0.8, pan: 0.4 });

  // ---- 3 the draw
  air(TL.tilt[0], 0.8, 1500, 0.6, 0, 0.5, true);
  boop(TL.head3 + 0.12, 480, 0.9, 0);
  k.play('riser', TL.lift0 - 0.35, { dur: 0.35, gain: 0.5 });
  const SC = ['C5', 'D5', 'E5', 'G5', 'A5', 'C6', 'D6', 'E6', 'G6', 'A6'];
  LIFT_I.forEach((i, kk) => {
    const t0 = LIFT_T(kk), land = t0 + TL.liftDur;
    k.play('tick', t0, { f: 4200, gain: 0.5, pan: pan(SLOT(kk)[0]) });
    k.tone(land, { f: SC[kk % 10], dur: 0.28, gain: 0.08 + 0.002 * kk, a: 0.002, verb: 0.3, pan: pan(SLOT(kk)[0]) });
  });
  shimmer(LIFT_T(19) + TL.liftDur, ['E5', 'A5', 'C6', 'E6'], 0.7, 0);

  // ---- wipe: a giant sun sweeps past
  air(TL.sweep[0], TL.sweep[1] - TL.sweep[0], 1300, 1.3, 0, 0.5);
  k.noise(TL.sweep[0] + 0.1, { dur: 0.75, color: 'brown', filter: 'lowpass', f: 260, gain: 0.32, a: 0.35, verb: 0.2 });
  k.tone(TL.sweep[0] + 0.1, { f: [[0, 70], [0.4, 58], [0.75, 46]], dur: 0.75, gain: 0.16, a: 0.3 });

  // ---- 4 the raffle drum: places 20 to 4
  boop(TL.head4 + 0.12, 500, 0.9, 0, false);
  const notes = ['C5', 'D5', 'E5', 'G5', 'A5'];
  for (let i = 0; i < 17; i++) {
    const t0 = DRAW_T(i), cpan = pan(CHUTE[0]), lpan = pan(SLOT_XY(i)[0]);
    steps(t0 - 0.45, t0 - 0.02, 0.06, (tt) => k.play('tock', tt, { f: 300 + (i % 3) * 40, gain: 0.07, pan: cpan, minor: true })); // rattle
    k.play('pop', t0, { gain: 0.7, pan: cpan });
    clink(t0 + TL.fly, notes[i % 5].replace('5', i >= 10 ? '6' : '5'), 0.8, lpan);
  }
  k.noise(TL.out5 - 1.4, { dur: 0.9, color: 'pink', filter: 'bandpass', f: [[0, 250], [0.9, 1800]], q: 0.8, gain: 0.2, a: 0.85, verb: 0.3 });

  // ---- 6 podium
  air(TL.out5, 0.5, 1000, 0.4, 0, 0.5, true);
  boop(TL.head6 + 0.12, 520, 0.9, 0, false);
  [[3, 'C4', 0.8], [2, 'E4', 0.9], [1, 'G4', 1.1]].forEach(([id, n, g], j) => {
    const tb = TL.blk[id], px = POD.find((p) => p.id === id).cx;
    k.play('thud', tb + 0.3, { f: 120 + j * 12, gain: 0.5, pan: pan(px) });
    pluck(tb + 0.32, n, g, pan(px));
    boop(tb + 0.35 + 0.3, 380 + j * 60, 0.8, pan(px), false); clink(tb + 0.35 + 0.34, 'A5', 0.8, pan(px));
    boop(tb + 0.7 + 0.12, 560, 0.7, pan(px));
    countTimes((tt) => podVal(POD.find((p) => p.id === id), tt), tb + 0.45, tb + 0.95).forEach((tt, i) => k.play('tick', tt, { f: 3600 + i * 50, gain: 0.7, pan: pan(px) }));
  });

  // ---- 7 the dive and the gold medal
  air(TL.zoom[0], TL.zoom[1] - TL.zoom[0] + 0.1, 2200, 1.2, 0, 0.9);
  k.tone(TL.zoom[0], { f: [[0, 110], [0.7, 330]], type: 'triangle', dur: 0.75, gain: 0.07, a: 0.6 });
  chord(TL.sw3, ['C3', 'G3', 'E4'], 0.6, 1.4);
  clink(TL.medalPop[0] + 0.1, 'E6', 1.0); k.play('ding', TL.medalPop[0] + 0.12, { f: 'A5', gain: 0.6 });
  pluck(TL.pill1 + 0.12, 'E4', 0.9, 0);
  k.noise(TL.cnt210[0] - 0.1, { dur: 0.6, color: 'pink', filter: 'bandpass', f: [[0, 250], [0.6, 1800]], q: 0.8, gain: 0.2, a: 0.55, verb: 0.3 });
  countTimes(val210, TL.cnt210[0], TL.cnt210[1]).forEach((tt, i) => k.play('tick', tt, { f: 3600 + i * 70, gain: 0.8 }));
  k.play('impact', TL.hit, { gain: 0.75 });
  chord(TL.hit, ['A2', 'E3', 'A3', 'C4', 'E4', 'B4'], 1.6, 2.4);
  shimmer(TL.hit + 0.08, ['E5', 'A5', 'C6', 'E5', 'B5'], 0.8, 0.3);
  k.play('ding', TL.hit + 0.02, { f: 'A6', gain: 0.9 });
  boop(TL.name1 + 0.12, 440, 0.9, 0, false);

  // ---- 8 takeaway
  air(TL.out8[0], 0.6, 1800, 0.7, 0, 0.5, true);
  pluck(TL.brand8 + 0.12, 'C4', 0.7, 0);
  chord(TL.cong + 0.1, ['C3', 'G3', 'C4', 'E4', 'G4', 'D5'], 1.0, 1.6);
  pluck(TL.cong + 0.12, 'C4', 0.9, 0);
  for (let i = 0; i < 20; i += 2) boop(TL.pack0 + i * TL.packStep + 0.12, 400 + (i % 6) * 40, 0.55, (i / 19) * 1.2 - 0.6);
  steps(TL.pack0 + 0.2, TL.line8 + 0.3, 0.17, (tt, i) => k.play('tock', tt, { f: 230 + (i % 3) * 20, gain: 0.07, pan: i % 2 ? 0.4 : -0.4, minor: true }));
  pluck(TL.line8 + 0.12, 'E4', 0.9, 0);
  chord(TL.line8 + 0.12, ['C3', 'G3', 'C4', 'E4', 'G4', 'D5'], 1.3, 1.8);
  shimmer(TL.line8 + 0.1, ['C6', 'E6', 'G6', 'C7'], 0.8, 0);
  k.play('ding', TL.line8 + 0.15, { f: 'C6', gain: 0.6 });
}


(function () {
  const canvas = document.getElementById('cv'), ctx = canvas.getContext('2d');
  const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), tlabel = document.getElementById('time');
  const soundBtn = document.getElementById('snd'), loopBox = document.getElementById('loop');
  // A real reveal (winners passed in by the /draw page) stops on 1st place instead of looping back to 20th.
  if (DRAW.names) loopBox.checked = false;
  scrub.max = String(DURATION);
  let cur = 0, playing = false, startWall = 0, startT = 0, stopSound = () => {}, soundOn = true, poster = true;
  const fmt = (t) => { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
  function render(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, 1280, 720);
    explainer(ctx, 1280, 720, t);
  }
  function ui() { scrub.value = String(cur); tlabel.textContent = fmt(cur) + ' / ' + fmt(DURATION); }
  function stopAudio() { stopSound(); stopSound = () => {}; }
  function startAudio() {
    stopAudio();
    if (!soundOn || !playing) return;
    try { stopSound = SOUND.live(scoreSound, cur, { voiceover: false }); } catch (e) { console.error('Sound failed to start:', e); }
  }
  function setPlaying(p) {
    playing = p; playBtn.textContent = p ? 'Pause' : 'Play'; playBtn.setAttribute('aria-pressed', String(p));
    if (p) { if (poster || cur >= DURATION - 0.01) cur = 0; poster = false; startT = cur; startWall = performance.now(); startAudio(); } else stopAudio();
  }
  function frame() {
    if (playing) {
      cur = Math.max(startT, startT + (performance.now() - startWall) / 1000 - 0.03);
      if (cur >= DURATION) {
        if (loopBox.checked) { cur = 0; startT = 0; startWall = performance.now(); startAudio(); }
        else { cur = DURATION; setPlaying(false); }
      }
    }
    render(poster ? 1.6 : cur); ui();
    requestAnimationFrame(frame);
  }
  playBtn.addEventListener('click', () => setPlaying(!playing));
  // Each drag step only moves the picture; the sound restarts once, from wherever the slider settles. (Restarting it
  // on every step piled up audio contexts until the browser refused more.)
  let scrubRestart = 0;
  scrub.addEventListener('input', () => {
    cur = parseFloat(scrub.value); poster = false; stopAudio();
    if (playing) { startT = cur; startWall = performance.now(); }
    clearTimeout(scrubRestart);
    scrubRestart = setTimeout(startAudio, 200);
    render(cur); ui();
  });
  // Full screen for the whole page (canvas + controls) - also from inside the /draw page's iframe, which allows it.
  // Hidden where the browser can't do it (e.g. iPhone Safari).
  const fsBtn = document.getElementById('fs'), d = document;
  const fsOn = () => !!(d.fullscreenElement || d.webkitFullscreenElement);
  if (!(d.fullscreenEnabled || d.webkitFullscreenEnabled)) fsBtn.hidden = true;
  fsBtn.addEventListener('click', () => {
    const el = d.documentElement;
    if (fsOn()) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  });
  const fsLabel = () => { fsBtn.textContent = fsOn() ? 'Exit full screen' : 'Full screen'; };
  d.addEventListener('fullscreenchange', fsLabel); d.addEventListener('webkitfullscreenchange', fsLabel);
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn; soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off'; soundBtn.setAttribute('aria-pressed', String(soundOn));
    if (!soundOn) stopAudio(); else if (playing) { startT = cur; startWall = performance.now(); startAudio(); }
  });
  window.seek = (t) => { cur = t; poster = false; render(t); ui(); };
  window.DURATION = DURATION; window.scoreSound = scoreSound;
  window.ready = Promise.all(['900 40px Nunito', '700 40px Nunito', '700 40px Fredoka', '400 40px Fredoka'].map((f) => document.fonts.load(f, 'AaZz09#$–'))).then(() => document.fonts.ready).catch(() => {}).then(() => { ui(); requestAnimationFrame(frame); });
})();
